name: Build NES Core

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Quartus
        run: |
          # Создаём build_id.v (обязательно для MiSTer-ядер)
          echo '`define BUILD_DATE "'$(date +%y%m%d)'"' > build_id.v

          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            raetro/quartus:17.1 \
            bash -c "
              quartus_map --read_settings_files=on NES
              quartus_fit --read_settings_files=off NES
              quartus_asm NES
            "

      - name: Upload RBF
        uses: actions/upload-artifact@v4
        with:
          name: NES_MiSTer_turbo
          path: |
            output_files/*.rbf
            *.rbf
